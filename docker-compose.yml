# WoWSimpleRegistration for AzerothCore, served over HTTPS by Traefik.
# Start AzerothCore first (it creates ac-network), then: docker compose up -d --build
name: wow-register

services:
  wow-register:
    container_name: wow-register
    build: .
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:?set TRAEFIK_NETWORK in .env}"
      - "traefik.http.routers.${SERVICE_NAME}.rule=Host(`${SERVICE_NAME}.${DOMAIN}`)"
      - "traefik.http.routers.${SERVICE_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${SERVICE_NAME}.tls=true"
      - "traefik.http.routers.${SERVICE_NAME}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${SERVICE_NAME}.service=${SERVICE_NAME}"
      - "traefik.http.services.${SERVICE_NAME}.loadbalancer.server.port=80"
      # Launcher tracker and web seeds on LAUNCHER_SEED_HOST (a DNS-only host, so Traefik sees the
      # player's real address). Only those paths answer there; the rest of the site stays on the main host.
      - "traefik.http.routers.${SERVICE_NAME}-seed.rule=Host(`${LAUNCHER_SEED_HOST:-${SERVICE_NAME}.${DOMAIN}}`) && (PathPrefix(`/api/launcher/announce.php`) || PathPrefix(`/api/launcher/seed.php`) || PathPrefix(`/realm/`))"
      - "traefik.http.routers.${SERVICE_NAME}-seed.entrypoints=websecure"
      - "traefik.http.routers.${SERVICE_NAME}-seed.tls=true"
      - "traefik.http.routers.${SERVICE_NAME}-seed.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${SERVICE_NAME}-seed.service=${SERVICE_NAME}"
    # No published ports: all traffic comes in through Traefik over HTTPS.
    environment:
      BASE_URL: https://${SERVICE_NAME}.${DOMAIN}
      SITE_TITLE: ${SITE_TITLE:-Simple Register}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      REALMLIST: ${REALMLIST:-}
      REALM_ID: ${REALM_ID:-1}
      REALM_NAME: ${REALM_NAME:-}
      REALM_KEY: ${REALM_KEY:-}
      PATCH_URL: ${PATCH_URL:-}
      DISABLE_TOP_PLAYERS: ${DISABLE_TOP_PLAYERS:-false}
      DISABLE_ONLINE_PLAYERS: ${DISABLE_ONLINE_PLAYERS:-false}
      DISABLE_CHANGEPASSWORD: ${DISABLE_CHANGEPASSWORD:-false}
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false}
      RESERVED_USERNAME_PREFIXES: ${RESERVED_USERNAME_PREFIXES-RNDBOT}
      RARE_TRACKER_URL: ${RARE_TRACKER_URL:-}
      WORLDMAP_URL: ${WORLDMAP_URL:-}
      CHANGELOG_ORG: ${CHANGELOG_ORG:-}
      CHANGELOG_REPOS: ${CHANGELOG_REPOS:-}
      CHANGELOG_MANIFEST: ${CHANGELOG_MANIFEST:-}
      CHANGELOG_UNGATED: ${CHANGELOG_UNGATED:-}
      CHANGELOG_TIMEZONE: ${CHANGELOG_TIMEZONE:-}
      CHANGELOG_CACHE_SECONDS: ${CHANGELOG_CACHE_SECONDS:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CAPTCHA_TYPE: ${CAPTCHA_TYPE:-0}
      CAPTCHA_KEY: ${CAPTCHA_KEY:-}
      CAPTCHA_SECRET: ${CAPTCHA_SECRET:-}
      DB_HOST: ac-database
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-wow_register}
      DB_PASS: ${DB_PASS:?set DB_PASS in .env}
      DB_AUTH_NAME: acore_auth
      DB_CHARACTERS_NAME: acore_characters
      DEBUG_MODE: ${DEBUG_MODE:-false}
      LAUNCHER_ENABLED: ${LAUNCHER_ENABLED:-false}
      LAUNCHER_DB_NAME: ${LAUNCHER_DB_NAME:-acore_launcher}
      LAUNCHER_TOKEN_DAYS: ${LAUNCHER_TOKEN_DAYS:-30}
      LAUNCHER_TORRENT_DIR: /srv/launcher/torrents
      LAUNCHER_CLIENT_DIR: /srv/launcher/client
      LAUNCHER_PATCH_DIR: ${LAUNCHER_PATCH_DIR:-/var/www/html/realm}
      LAUNCHER_PATCH_URL: ${LAUNCHER_PATCH_URL:-}
      LAUNCHER_SEED_HOST: ${LAUNCHER_SEED_HOST:-}
      LAUNCHER_CLIENT_IP_HEADER: ${LAUNCHER_CLIENT_IP_HEADER:-}
      LAUNCHER_WEB_SEEDS: ${LAUNCHER_WEB_SEEDS:-4}
      LAUNCHER_PUBLIC_ADDRESS: ${LAUNCHER_PUBLIC_ADDRESS:-}
      LAUNCHER_DOWNLOAD_URL: ${LAUNCHER_DOWNLOAD_URL:-}
    volumes:
      # mod-realm-config output directory (realm.conf), served read-only at /realm/
      - ${REALM_CONFIG_DIR:-./realm-data}:/var/www/html/realm:ro
      # AzerothCore's modules/ folder: the patch notes read which commit each module is on
      - ${AC_MODULES_DIR:-./ac-modules}:/srv/ac-modules:ro
      # Launcher downloads: the .torrent files and the client they describe (web seed), read-only
      - ${LAUNCHER_TORRENT_DIR:-./launcher-torrents}:/srv/launcher/torrents:ro
      - ${LAUNCHER_CLIENT_DIR:-./launcher-client}:/srv/launcher/client:ro
    networks:
      - ac-network   # to reach ac-database
      - traefik      # so Traefik can reach this container

networks:
  ac-network:
    external: true
    name: ${AC_NETWORK_NAME:-ix-azerothcore_ac-network}
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}
