ServerTokens Prod
ServerSignature Off

# PHP code, config and vendor libs are included by index.php, never served directly.
<DirectoryMatch "^/var/www/html/(application|docker)">
    Require all denied
</DirectoryMatch>
<DirectoryMatch "/\.">
    Require all denied
</DirectoryMatch>
<FilesMatch "^(Dockerfile|docker-compose\.yml|.*\.md)$">
    Require all denied
</FilesMatch>

# mod-realm-config output (realm.conf and any other public module files), mounted read-only.
# Serve files as-is: no directory listing, no PHP.
<Directory /var/www/html/realm>
    Options -Indexes
    AddType text/plain .conf
    <IfModule php_module>
        php_admin_flag engine off
    </IfModule>
    <FilesMatch "\.(?i:php\d?|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>
