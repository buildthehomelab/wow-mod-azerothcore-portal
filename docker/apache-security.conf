ServerTokens Prod
ServerSignature Off

# PHP code, config and vendor libs are included by index.php, never served directly.
<DirectoryMatch "^/var/www/html/(application|docker)">
    Require all denied
</DirectoryMatch>
<DirectoryMatch "/\.">
    Require all denied
</DirectoryMatch>
<FilesMatch "^(Dockerfile|docker-compose\.yml|.*\.md)$">
    Require all denied
</FilesMatch>
